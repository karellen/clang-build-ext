name: clang-build-ext
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.14'
          - '3.13'
          - '3.12'
          - '3.11'
          - '3.10'
        # Each entry sits on one side of an API change that affects this plugin.
        # See the compatibility table in README.md.
        setuptools-version:
          - '84.0'
          - '82.0'     # deploy pin
          - '81.0.0'   # first without new_compiler(dry_run=)
          - '80.10.2'  # last with new_compiler(dry_run=)
          - '75.9'     # new_compiler relocated to distutils.compilers.C.base
          - '72.2.0'   # first with the C++ executables
          - '72.1.0'   # last without them
          - '70.1.0'   # first not requiring wheel
          - '70.0.0'   # last requiring wheel
          - '68.0'     # oldest supported
    env:
      DEPLOY_PYTHONS: "3.14"
      DEPLOY_OSES: "Linux"
      DEPLOY_SETUPTOOLS: "82.0"
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - shell: bash
        run: |
          echo "PYB_EXTRA_ARGS=--no-venvs" >> $GITHUB_ENV
          echo "SETUPTOOLS_VER=~=${{matrix.setuptools-version}}" >> $GITHUB_ENV

      - uses: pybuilder/build@master
        with:
          checkout: false
          with-venv: false
          python-version: ${{ matrix.python-version }}
          pyb-extra-args: ${{ env.PYB_EXTRA_ARGS }}
          is-upload: >-
            ${{ github.event_name == 'push'
            && contains(env.DEPLOY_OSES, runner.os)
            && contains(env.DEPLOY_PYTHONS, matrix.python-version)
            && contains(env.DEPLOY_SETUPTOOLS, matrix.setuptools-version) }}
          pre-build: |
            $PYTHON -m pip install karellen-llvm-clang[tools] build wheel
            $PYTHON -c pass

          release-app-id: ${{ secrets.PYBUILDER_RELEASE_APP_ID }}
          release-app-private-key: ${{ secrets.PYBUILDER_RELEASE_APP_PRIVATE_KEY }}
  build-summary:
    if: success() || failure()
    runs-on: ubuntu-latest
    name: Build Summary
    needs: build
    steps:
      - name: Check build matrix status
        if: needs.build.result != 'success'
        run: exit 1
